<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="text-center mb-5">
        <h1 class="fw-bold text-danger">Order Summary</h1>
        <p>Add quantity and view your total bill.</p>
    </div>

    <div class="card shadow p-4">

        <table class="table table-bordered text-center align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Item</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody id="orderTableBody"></tbody>
        </table>

        <div class="text-end mt-4">
            <h3>Grand Total: ₹<span id="grandTotal">0</span></h3>
        </div>

        <div class="text-center mt-4">
            <button class="btn btn-success btn-lg">Place Order</button>
            <a href="index.html" class="btn btn-secondary btn-lg">Back</a>
        </div>

    </div>
</div>

<script src="order.js"></script>
</body>
</html>
